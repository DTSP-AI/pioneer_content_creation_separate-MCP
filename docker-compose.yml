# Content Creation Agent v3.0.0 - Docker Compose Configuration
# Multi-service orchestration with Mem0 + Qdrant + PiAPI MCP Integration

version: '3.8'

services:
  # ============================================================================
  # Backend Services
  # ============================================================================

  # Main FastAPI backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: content-agent-backend
    ports:
      - "8006:8000"  # Backend on 8006 (if taken, use 8007)
    environment:
      # Core AI Services
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}

      # Memory Services
      - MEM0_API_KEY=${MEM0_API_KEY}
      - MEM0_ORG_ID=${MEM0_ORG_ID:-default-org}

      # Qdrant Vector Store
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-content_creation_memory}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}

      # Database Configuration
      - DATABASE_URL=postgresql+asyncpg://agentuser:${POSTGRES_PASSWORD:-changeme}@postgres:5432/content_agent
      - POSTGRES_USER=agentuser
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=content_agent
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432

      # PiAPI MCP Server
      - PIAPI_MCP_SERVER_URL=http://piapi-mcp:7870/sse
      - PIAPI_MCP_ENABLED=${PIAPI_MCP_ENABLED:-true}
      - PIAPI_API_KEY=${PIAPI_API_KEY}

      # Google Services
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-}
      - YOUTUBE_CLIENT_SECRET_PATH=/app/secrets/client_secret.json

      # Cost Limits
      - MAX_DAILY_COST_USD=${MAX_DAILY_COST_USD:-100.0}
      - MAX_PER_WORKFLOW_COST_USD=${MAX_PER_WORKFLOW_COST_USD:-10.0}

      # Application Settings
      - APP_NAME=Content Creation Agent
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

    volumes:
      # Persistent data
      - ./data:/app/data
      - ./videos:/app/videos
      - ./logs:/app/logs

      # Secrets (OAuth credentials)
      - ./secrets:/app/secrets:ro

      # Development: Mount code for hot reload (uncomment for dev)
      # - ./backend:/app/backend
      # - ./app:/app/app

    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      piapi-mcp:
        condition: service_started

    networks:
      - agent-network
    restart: unless-stopped
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # React Frontend (Framer Motion UI)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: content-agent-frontend
    ports:
      - "3006:80"  # Frontend on 3006 (if taken, use 3007)
    depends_on:
      - backend
    networks:
      - agent-network
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # ============================================================================
  # Data Services
  # ============================================================================

  # PostgreSQL database (structured data + thread persistence)
  postgres:
    image: postgres:15-alpine
    container_name: content-agent-db
    environment:
      - POSTGRES_USER=agentuser
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=content_agent
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=en_US.UTF-8
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - agent-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentuser -d content_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Qdrant vector store (conversation history + embeddings)
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: content-agent-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    networks:
      - agent-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (future: caching/queue support)
  redis:
    image: redis:7-alpine
    container_name: content-agent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - agent-network
    restart: unless-stopped
    command: redis-server --appendonly yes
    profiles:
      - optional

  # ============================================================================
  # Integration Services
  # ============================================================================

  # PiAPI MCP Server (video generation tools)
  piapi-mcp:
    build:
      context: ./PiAPI_MCP/piapi-mcp-server
      dockerfile: Dockerfile
    container_name: content-agent-piapi-mcp
    ports:
      - "7870:7870"
    environment:
      - PIAPI_API_KEY=${PIAPI_API_KEY}
      - NODE_ENV=production
      - PORT=7870
    networks:
      - agent-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7870/health"]
      interval: 15s
      timeout: 10s
      retries: 3

  # ============================================================================
  # Production Services (optional)
  # ============================================================================

  # Nginx reverse proxy (production only)
  nginx:
    image: nginx:alpine
    container_name: content-agent-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - agent-network
    restart: unless-stopped
    profiles:
      - production

# ============================================================================
# Persistent Volumes
# ============================================================================

volumes:
  postgres_data:
    driver: local
  qdrant_data:
    driver: local
  redis_data:
    driver: local

# ============================================================================
# Networks
# ============================================================================

networks:
  agent-network:
    driver: bridge
